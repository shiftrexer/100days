<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>100days</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <style id="fishPositionFix">
    #clownfishPasser{top:72% !important;}
    #tangPasser{top:79% !important;}
    #turtlePasser{top:30% !important;}
    #diverPasser{top:37% !important;}
    #whaleSharkPasser{top:50% !important;width:101px !important;height:48px !important;}
    #penguinPasser{top:20% !important;}
    #octopusPasser{top:88% !important;width:48px !important;height:36px !important;}
    #pufferPasser{top:61% !important;width:43px !important;height:34px !important;}
    #bottlePasser{top:10% !important;width:22px !important;height:31px !important;}
    #todayColumnCard{padding:8px 13px !important;}
    #todayColumnCard .eyebrow{font-size:9px !important;line-height:1.1;margin-bottom:2px !important;}
    #todayColumnCard h2{font-size:15px !important;line-height:1.15 !important;}
    #todayColumnCard p{font-size:10px !important;line-height:1.2 !important;margin:3px 0 2px !important;}
    #todayColumnCard .text-button{font-size:11px !important;line-height:1.1;padding:0 !important;}
    #elapsedText{margin:14px 0 1px !important;}
    #homeScreen .water-section{padding-top:10px !important;}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">100days</div>
      <button class="icon-button" id="settingsBtn" aria-label="設定">⋯</button>
    </header>

    <main>
      <section class="screen active" id="homeScreen" aria-label="ホーム">
        <section class="today-column" id="todayColumnCard">
          <div class="eyebrow">TODAY'S COLUMN</div>
          <h2 id="todayColumnTitle">DAY 1｜減量は「続けられる設計」が9割</h2>
          <p>今日のコラムを1〜3分で読めます。</p>
          <button class="text-button" data-open-column="0">読む →</button>
        </section>

        <div class="elapsed" id="elapsedText">開始から1日目</div>

        <section class="water-section" aria-label="実施日数">
          <div class="water-orb" id="waterOrb">
            <canvas id="waterCanvas" width="760" height="760" aria-hidden="true"></canvas>
            <div class="orb-glass" aria-hidden="true"></div>
            <div class="orb-label">
              <div class="count"><span id="completedCount">0</span><span class="slash">/</span><span>100</span></div>
              <div class="count-label">実施日数</div>
            </div>
          </div>
        </section>

        <section class="detail-card">
          <div class="detail-row">
            <div>
              <div class="detail-label">現在の体重</div>
              <div class="detail-value"><span id="currentWeight">--</span><small> kg</small></div>
            </div>
            <div class="detail-right">
              <div class="detail-label">開始比</div>
              <div class="detail-value" id="weightDelta">--</div>
            </div>
          </div>
          <div class="divider"></div>
          <div class="mini-grid">
            <div class="mini-item"><span>連続実施</span><strong id="streakCount">0日</strong></div>
            <div class="mini-item"><span>残り</span><strong id="remainingCount">100日</strong></div>
          </div>
        </section>

        <p class="helper" id="todayStatus">実施日数を表示しています。</p>

        <section class="test-code-panel" aria-label="テスト用日付コード">
          <div class="test-code-label">TEST MODE</div>
          <div class="test-code-row">
            <input id="testCodeInput" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="コードを入力" maxlength="8" />
            <button id="applyTestCodeBtn" type="button">適用</button>
          </div>
          <button class="danger-button" id="undoTodayBtn" type="button">実施取り消し</button>
          <p id="testCodeStatus">テスト用コードを入力</p>
        </section>
      </section>

      <section class="screen" id="recordScreen" aria-label="実施">
        <div id="dailyExecutionApp"></div>

        <form id="recordForm" style="display:none" aria-hidden="true">
          <input id="weightInput" type="number" />
          <input id="fatInput" type="number" />
          <input id="stepsInput" type="number" />
          <textarea id="memoInput"></textarea>
        </form>
      </section>

      <section class="screen" id="columnsScreen" aria-label="コラム">
        <div class="page-heading">
          <div class="eyebrow">100 COLUMNS</div>
          <h1>100days コラム</h1>
          <p>経過日数に合わせて1本ずつ読み進めます。</p>
        </div>
        <div class="column-list" id="columnList"></div>
      </section>

      <section class="screen" id="progressScreen" aria-label="進捗">
        <div class="page-heading">
          <div class="eyebrow">PROGRESS</div>
          <h1>100日の進捗</h1>
          <p>実施した日だけ塗りつぶされます。</p>
        </div>
        <div class="progress-summary">
          <div><span>実施</span><strong id="progressDone">0</strong></div>
          <div><span>未実施</span><strong id="progressMissed">0</strong></div>
          <div><span>残り</span><strong id="progressRemaining">100</strong></div>
        </div>
        <div class="day-grid" id="dayGrid"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-item active" data-screen="homeScreen"><span class="nav-icon">⌂</span><span>ホーム</span></button>
      <button class="nav-item" data-screen="recordScreen"><span class="nav-icon">✓</span><span>実施</span></button>
      <button class="nav-item" data-screen="columnsScreen"><span class="nav-icon">▤</span><span>コラム</span></button>
      <button class="nav-item" data-screen="progressScreen"><span class="nav-icon">◷</span><span>進捗</span></button>
    </nav>
  </div>

  <dialog id="settingsDialog" class="sheet-dialog">
    <form method="dialog" class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h2>設定</h2><button class="icon-button" value="cancel" aria-label="閉じる">×</button></div>
      <label>開始日<input id="startDateInput" type="date" /></label>
      <label>開始体重（kg）<input id="startWeightInput" type="number" step="0.1" min="20" max="300" placeholder="例 74.0" /></label>
      <button class="primary-action" id="saveSettingsBtn" value="default">保存</button>
      <button class="danger-button" id="resetBtn" type="button">すべての記録をリセット</button>
    </form>
  </dialog>

  <dialog id="columnDialog" class="article-dialog">
    <article class="article-sheet">
      <button class="article-close" id="closeColumnBtn" aria-label="閉じる">×</button>
      <div class="eyebrow" id="articleDay">DAY 1</div>
      <h1 id="articleTitle"></h1>
      <div class="article-body" id="articleBody"></div>
    </article>
  </dialog>

  <script src="app.js?v=20261103-nocompletion"></script>
  <script src="undo.js?v=20261102-fish2"></script>
  <script src="daily-execution.js?v=20261104-cardio-flow"></script>
  <script src="cardio-timer.js?v=20261104-cardio-timer1"></script>
  <script src="fish-fix.js?v=20261102-clown4"></script>
  <script src="clownfish-height.js?v=20261103-clownheight72"></script>
  <script src="turtle.js?v=20261102-turtle1"></script>
  <script src="diver.js?v=20261102-diver11-hdfile"></script>
  <script src="whaleshark-v4.js?v=20261103-whale14-embedded-webp"></script>
  <script src="penguin.js?v=20261103-penguin1"></script>
  <script src="octopus.js?v=20261103-octopus1"></script>
  <script src="puffer.js?v=20261103-puffer1"></script>
  <script src="bottle.js?v=20261103-bottle1"></script>
  <script src="bottle-letter.js?v=20261103-bottleletter6-hd-testreset"></script>
  <script src="pinkfish.js?v=20261103-pink1"></script>
  <script src="orb-clip.js?v=20261103-orbclip1"></script>
  <script src="random-direction.js?v=20261105-searider025"></script>
  <script src="creature-thresholds.js?v=20261103-completed-days3-bottleletters"></script>
</body>
</html>
